# ReadTheDocs build configuration for the Scorch documentation.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The docs build imports `scorch` for autodoc but does NOT compile the native
# `scorch_ops` extension (it is mocked in docs/source/conf.py). We install a
# CPU-only torch wheel so the import succeeds without pulling the large CUDA
# build, then the lightweight documentation dependencies.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    pre_install:
      - pip install --upgrade pip
      - pip install torch --index-url https://download.pytorch.org/whl/cpu

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

formats:
  - pdf
  - htmlzip
