<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" width="880" height="486" role="img" aria-labelledby="t d">
<title id="t">One sparse matrix stored in three formats</title>
<desc id="d">A 4 by 6 matrix with 7 nonzeros, values 1 to 7, and an empty row 1, stored as CSR (format "ds"), DCSR (format "ss") and COO (format "oo"). CSR: level 1 dense of size 4; level 2 compressed with pos 0 2 2 5 7 and crd 0 3 1 2 5 0 4. DCSR: level 1 compressed with pos 0 3 and crd 0 2 3; level 2 compressed with pos 0 2 5 7 and crd 0 3 1 2 5 0 4. COO: level 1 coordinate with crd 0 0 2 2 2 3 3; level 2 coordinate with crd 0 3 1 2 5 0 4. Values in every format: 1 2 3 4 5 6 7.</desc>
