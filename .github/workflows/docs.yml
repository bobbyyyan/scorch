name: docs

# Build the Sphinx documentation and publish it to GitHub Pages.
#
# The build imports `scorch` for autodoc but mocks the native `scorch_ops`
# extension (see docs/source/conf.py), so no C++ toolchain is needed — only a
# CPU-only torch wheel plus the lightweight doc dependencies.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/scorch/**"
      - ".github/workflows/docs.yml"
      - ".readthedocs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "src/scorch/**"
  workflow_dispatch:

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch + doc dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r docs/requirements.txt

      - name: Build HTML (warnings are errors)
        run: |
          sphinx-build -b html -W --keep-going -n docs/source docs/build/html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    # Only publish from main; PRs just build to verify.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
