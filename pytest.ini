[pytest]
# The suite is tests/. Without this, a bare `pytest` also collects bench/test_abi_guards.py --
# a standalone script whose module body runs its checks and calls sys.exit at import time, which
# pytest reports as INTERNALERROR: SystemExit and which aborts the whole run before a single test
# executes. CLAUDE.md already documents `pytest tests/` as the invocation; this makes the bare
# form mean the same thing rather than fail confusingly.
testpaths = tests
markers =
    perf: performance tests
filterwarnings =
    ignore:Sparse CSR tensor support is in beta state:UserWarning
